location ~ ^/api/checkout/([A-Za-z0-9_-]+)/frame$ {
    return 302 /payment/$1;
}

location /payment/ {
    proxy_pass https://pay.listopays.com/payment/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name pay.listopays.com;
    proxy_set_header Host pay.listopays.com;
    proxy_set_header Origin https://pay.listopays.com;
    proxy_set_header Referer https://pay.listopays.com$request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host pay.listopays.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_cookie_domain pay.listopays.com listopays.doubleclickds.com;
    proxy_redirect https://pay.listopays.com/ /;
    sub_filter "</head>" "<link rel=\"stylesheet\" href=\"/brand/checkout.css\"/><script src=\"/brand/checkout.js?v=5\" defer></script></head>";
    sub_filter "/img/logo.png" "/brand/leez-lockup.png";
    sub_filter "/brand/logo.png" "/brand/leez-lockup.png";
    sub_filter "Listopay - Secure Payment Gateway" "Leez Pay";
    sub_filter_once off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
}

location = /img/logo.png {
    alias /var/www/listopays-console/public/brand/leez-lockup.png;
    add_header Cache-Control "no-store";
}

location ^~ /_next/static/ {
    alias /var/www/listopays-console/.next/static/;
    access_log off;
    error_page 404 = @gateway_next;
}

location @gateway_next {
    internal;
    proxy_pass https://pay.listopays.com;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name pay.listopays.com;
    proxy_set_header Host pay.listopays.com;
    proxy_set_header Origin https://pay.listopays.com;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}

location /img/ {
    proxy_pass https://pay.listopays.com/img/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name pay.listopays.com;
    proxy_set_header Host pay.listopays.com;
}

location / {
    proxy_pass http://127.0.0.1:3060;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
